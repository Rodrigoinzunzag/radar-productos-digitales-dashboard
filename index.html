<script>
const DATA = JSON.parse(document.getElementById('radarData').textContent);
const TRACKS = {
  pdf: { title: 'Productos Digitales - PDF', data: { available: true, error: null, metrics: DATA.metrics || {}, items: DATA.items || [] } },
  mini_apps: { title: 'Productos Digitales - Mini Apps', data: DATA.mini_apps || { available: false, error: 'El generador todavía no incluye la hoja Mini Apps.', metrics: {}, items: [] } }
};
let track = 'pdf', view = 'prioridades', vFilter = '', selMap = null;
const selected = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? u : '';
const fmt = n => n === null || n === undefined || n === '' ? '—' : n;
const pct = x => x === null || x === undefined ? '—' : `${Math.round(x * 100)}%`;
const FLAG = { Chile: '🇨🇱', Argentina: '🇦🇷', Brazil: '🇧🇷' };
const COUNTRY_ES = { Brazil: 'Brasil' };
const countryLabel = c => `${FLAG[c] || ''} ${esc(COUNTRY_ES[c] || c || 'Sin país')}`.trim();
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* Regla de decisión */
const V = {
  replicar:   { label: 'Replicar ya', hint: 'Score ≥ 70 y sin caída', cls: 'v-replicar', color: 'var(--go)', bg: 'var(--goBg)' },
  investigar: { label: 'Investigar', hint: 'Score 45–69 y sin caída', cls: 'v-investigar', color: 'var(--inv)', bg: 'var(--invBg)' },
  vigilar:    { label: 'Vigilar', hint: 'Nuevo, en alza, sin datos o cayendo con score alto', cls: 'v-vigilar', color: 'var(--watch)', bg: 'var(--watchBg)' },
  descartar:  { label: 'Descartar', hint: 'Desaparece, 0 anuncios o cae con score bajo', cls: 'v-descartar', color: 'var(--drop)', bg: 'var(--dropBg)' },
};
function verdict(x) {
  const down = String(x.trend_class || '').startsWith('down');
  if (x.trend === 'Desaparece' || x.current_count === 0) return 'descartar';
  if (x.score >= 70 && !down) return 'replicar';
  if (x.score >= 45 && !down) return 'investigar';
  if (down && x.score < 45) return 'descartar';
  return 'vigilar';
}
function why(x) {
  const d = x.delta == null ? 'sin comparación previa' : x.delta > 0 ? `+${x.delta} vs anterior` : x.delta < 0 ? `${x.delta} vs anterior` : 'sin cambio';
  return `${fmt(x.current_count)} anuncios activos · ${d} · ${x.observations} observaciones`;
}
const chip = x => `<span class="chip ${V[verdict(x)].cls}">${V[verdict(x)].label}</span>`;
const ring = (x, size) => `<div class="ring" style="background:${V[verdict(x)].bg};color:${V[verdict(x)].color}${size ? `;width:${size}px;height:${size}px` : ''}">${x.score}</div>`;
const deltaHtml = x => x.delta == null ? '<span class="delta flat">—</span>' : `<span class="delta ${x.delta > 0 ? 'up' : x.delta < 0 ? 'down' : 'flat'}">${x.delta > 0 ? '▲ +' : x.delta < 0 ? '▼ ' : ''}${x.delta}</span>`;
const spark = c => { if (!c || !c.length) return '<span class="small">—</span>'; const m = Math.max(...c, 1); return '<span class="spark" aria-hidden="true">' + c.map(v => `<i style="height:${Math.max(2, Math.round(v / m * 22))}px"></i>`).join('') + '</span>'; };
const isApp = x => x.track === 'mini_apps' || String(x.id).startsWith('app-');
const subline = x => isApp(x)
  ? `<span class="typeTag">${esc(x.app_type || 'Sin tipo')}</span>${x.price ? ` · ${esc(x.price)} ${esc(x.currency)}` : ''}${x.billing ? ` · ${esc(x.billing)}` : ''}`
  : esc(x.niche || '');

function items() { return TRACKS[track].data.items || []; }
function allItems() { return [...TRACKS.pdf.data.items, ...(TRACKS.mini_apps.data.items || [])]; }
function itemById(id) { return allItems().find(x => x.id === id); }

function filtered() {
  const q = $('q').value.toLowerCase().trim(), c = $('country').value;
  let rows = items().filter(x => !c || (x.country || 'Sin país detectado') === c);
  if (track === 'mini_apps') {
    const t = $('appType').value, b = $('billing').value;
    if (t) rows = rows.filter(x => x.app_type === t);
    if (b) rows = rows.filter(x => x.billing === b);
  }
  if (q) rows = rows.filter(x => [x.advertiser, x.product, x.niche, x.notes, x.keyword, x.app_type, x.checkout, x.tech].join(' ').toLowerCase().includes(q));
  const s = $('sort').value;
  return rows.sort((a, b) =>
    s === 'growth' ? (b.delta ?? -9999) - (a.delta ?? -9999) :
    s === 'ads' ? (b.current_count ?? -1) - (a.current_count ?? -1) :
    s === 'recent' ? String(b.latest_date).localeCompare(String(a.latest_date)) :
    s === 'days' ? (b.days_active ?? -1) - (a.days_active ?? -1) :
    b.score - a.score);
}

/* Vista Prioridades */
function renderPrioridades(rows) {
  const counts = Object.fromEntries(Object.keys(V).map(k => [k, rows.filter(x => verdict(x) === k).length]));
  const list = vFilter ? rows.filter(x => verdict(x) === vFilter) : rows;
  const top = rows.filter(x => verdict(x) === 'replicar').sort((a, b) => b.score - a.score).slice(0, 3);
  $('viewPrioridades').innerHTML = `
    <div class="kpis">${Object.entries(V).map(([k, v]) => `<button class="kpi" type="button" data-v="${k}" aria-pressed="${vFilter === k}"><div class="n" style="color:${v.color}">${counts[k]}</div><div class="l">${v.label}</div><div class="h">${v.hint}</div></button>`).join('')}</div>
    ${top.length && !vFilter ? `<div class="sectionTitle">Mejores oportunidades</div><div class="top3">${top.map(x => `
      <div class="card hero" data-id="${esc(x.id)}" tabindex="0">
        <div class="row">${chip(x)}<span class="small">${countryLabel(x.country)}</span></div>
        <div><div class="name">${esc(x.advertiser)}</div><div class="small">${esc(x.product)}</div></div>
        <div class="row">${ring(x)}<div style="text-align:right"><div class="delta">${fmt(x.current_count)} anuncios</div><div class="small">${deltaHtml(x)} · ${esc(x.trend)}</div></div></div>
      </div>`).join('')}</div>` : ''}
    <div class="sectionTitle"><span>${vFilter ? V[vFilter].label : 'Todos los anunciantes'} <span class="small">(${list.length})</span></span>${vFilter ? '<button class="linkBtn" type="button" data-v="">Ver todos</button>' : ''}</div>
    <div class="card list">${list.map(x => `
      <div class="li" data-id="${esc(x.id)}" tabindex="0">
        <button class="pick" type="button" data-pick="${esc(x.id)}" aria-pressed="${selected.has(x.id)}" aria-label="Seleccionar ${esc(x.advertiser)}">✓</button>
        <div class="c-verdict">${chip(x)}</div>
        ${ring(x)}
        <div style="min-width:0"><div class="name">${esc(x.advertiser)}</div><div class="small">${subline(x)} · ${countryLabel(x.country)}</div></div>
        <div class="c-ads"><div class="num">${fmt(x.current_count)} anuncios</div><div class="small">${deltaHtml(x)} · ${esc(x.trend)}</div></div>
        <div class="c-spark">${spark(x.last3_counts)}</div>
        <div class="c-brief"><button class="btn ghost" type="button" data-brief="${esc(x.id)}">Brief</button></div>
      </div>`).join('') || '<div class="empty">Sin resultados con los filtros actuales.</div>'}</div>`;
}

/* Vista Mapa */
function renderMapa(rows) {
  if (!selMap || !rows.find(x => x.id === selMap)) selMap = rows[0] && rows[0].id;
  const W = 760, H = 460, P = { l: 56, r: 18, t: 20, b: 44 };
  const maxC = Math.max(4, ...rows.map(x => x.current_count || 0));
  const sx = c => P.l + Math.sqrt(Math.max(0, c || 0) / maxC) * (W - P.l - P.r);
  const pc = x => x.pct_change == null ? (x.delta > 0 ? 1 : 0) : Math.max(-1, Math.min(1, x.pct_change));
  const sy = v => P.t + (1 - (v + 1) / 2) * (H - P.t - P.b);
  const midX = sx(maxC * 0.25);
  const ordered = [...rows].sort((a, b) => (a.id === selMap) - (b.id === selMap));
  const dots = ordered.map(x => `<circle class="dot ${x.id === selMap ? 'sel' : ''}" data-id="${esc(x.id)}" cx="${sx(x.current_count).toFixed(1)}" cy="${sy(pc(x)).toFixed(1)}" r="${(5 + x.score / 12).toFixed(1)}" fill="${V[verdict(x)].color}" fill-opacity=".85"><title>${esc(x.advertiser)} · ${V[verdict(x)].label} · score ${x.score} · ${fmt(x.current_count)} anuncios · ${pct(x.pct_change)}</title></circle>`).join('');
  const xt = [0, Math.round(maxC * 0.25), Math.round(maxC * 0.5), maxC].map(t => `<text x="${sx(t)}" y="${H - P.b + 16}" text-anchor="middle">${t}</text>`).join('');
  const yt = [[1, '+100%'], [0.5, '+50%'], [0, '0%'], [-0.5, '−50%'], [-1, '−100%']].map(([v, l]) => `<text x="${P.l - 8}" y="${sy(v) + 4}" text-anchor="end">${l}</text>`).join('');
  const x = rows.find(i => i.id === selMap);
  $('viewMapa').innerHTML = `
    <div class="matrix">
      <div class="card plot">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de anunciantes: volumen de anuncios contra cambio porcentual">
          <line x1="${P.l}" x2="${W - P.r}" y1="${sy(0)}" y2="${sy(0)}" stroke="currentColor" stroke-opacity=".18"/>
          <line x1="${midX}" x2="${midX}" y1="${P.t}" y2="${H - P.b}" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="4 4"/>
          <text class="quad" x="${W - P.r - 6}" y="${P.t + 14}" text-anchor="end">Escalando · actuar</text>
          <text class="quad" x="${P.l + 8}" y="${P.t + 14}">Emergentes · vigilar</text>
          <text class="quad" x="${W - P.r - 6}" y="${H - P.b - 8}" text-anchor="end">Consolidados en baja</text>
          <text class="quad" x="${P.l + 8}" y="${H - P.b - 8}">Débiles · descartar</text>
          ${dots}${xt}${yt}
          <text x="${(W + P.l) / 2}" y="${H - 6}" text-anchor="middle">Anuncios activos</text>
          <text x="14" y="${H / 2}" text-anchor="middle" transform="rotate(-90 14 ${H / 2})">Cambio % vs observación anterior</text>
        </svg>
        <div class="legend">${Object.values(V).map(v => `<span class="chip ${v.cls}">${v.label}</span>`).join('')}<span class="small">Tamaño del punto = score · ${rows.length} anunciantes</span></div>
      </div>
      <div class="card side">${x ? detailHtml(x, true) : '<div class="small">Sin anunciantes con los filtros actuales.</div>'}</div>
    </div>`;
}

/* Detalle */
function detailHtml(x, inline) {
  const app = isApp(x), link = safeUrl(x.link);
  return `
    <div class="dHead">${chip(x)}${inline ? '' : '<button class="btn ghost" type="button" data-close>Cerrar</button>'}</div>
    <div><div class="dTitle" style="font-size:${inline ? 19 : 22}px">${esc(x.advertiser)}</div><div class="small">${esc(x.product)}</div>${app ? `<div style="margin-top:6px"><span class="typeTag">${esc(x.app_type || 'Sin tipo')}</span></div>` : ''}</div>
    <div class="rule">${V[verdict(x)].hint}. ${why(x)}.</div>
    <div class="facts">
      <div class="fact"><div class="k">Score</div><div class="v">${x.score}/100</div></div>
      <div class="fact"><div class="k">Tendencia</div><div class="v">${esc(x.trend)}</div></div>
      <div class="fact"><div class="k">Anuncios (antes → ahora)</div><div class="v">${fmt(x.previous_count)} → ${fmt(x.current_count)}</div></div>
      <div class="fact"><div class="k">País</div><div class="v">${countryLabel(x.country)}</div></div>
      ${app ? `
      <div class="fact"><div class="k">Precio · cobro</div><div class="v">${x.price ? `${esc(x.price)} ${esc(x.currency)}` : '—'} · ${esc(x.billing || '—')}</div></div>
      <div class="fact"><div class="k">Días activo · checkout</div><div class="v">${fmt(x.days_active)} · ${esc(x.checkout || '—')}</div></div>
      ${x.tech && x.tech !== 'No visible' ? `<div class="fact"><div class="k">Tecnología</div><div class="v">${esc(x.tech)}</div></div>` : ''}
      ${x.countries_seen && x.countries_seen.length > 1 ? `<div class="fact"><div class="k">Visto en</div><div class="v">${x.countries_seen.map(countryLabel).join(', ')}</div></div>` : ''}` : `
      <div class="fact"><div class="k">Nicho</div><div class="v">${esc(x.niche || '—')}</div></div>
      <div class="fact"><div class="k">Últimos conteos</div><div class="v">${(x.last3_counts || []).join(' → ') || '—'}</div></div>`}
      <div class="fact"><div class="k">Palabra clave</div><div class="v">${esc(x.keyword || '—')}</div></div>
      <div class="fact"><div class="k">Última revisión</div><div class="v">${esc(x.latest_date || '—')}</div></div>
    </div>
    <div class="notes">${esc(x.notes) || 'Sin notas.'}</div>
    <div class="actions">${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir landing</a>` : ''}<button class="btn ghost" type="button" data-brief="${esc(x.id)}">Copiar brief</button><button class="btn ghost" type="button" data-pick="${esc(x.id)}" aria-pressed="${selected.has(x.id)}">${selected.has(x.id) ? 'Quitar de selección' : 'Seleccionar'}</button></div>`;
}
let lastFocus = null;
function openDrawer(id) {
  const x = itemById(id); if (!x) return;
  lastFocus = document.activeElement;
  $('drawer').innerHTML = detailHtml(x, false); $('drawer').dataset.id = id;
  $('drawer').hidden = false; $('drawerBg').hidden = false;
  const c = $('drawer').querySelector('[data-close]'); if (c) c.focus();
}
function closeDrawer() { $('drawer').hidden = true; $('drawerBg').hidden = true; if (lastFocus) lastFocus.focus(); }

/* Brief */
function briefFor(x) {
  const header = `Decisión del radar: ${V[verdict(x)].label} (${V[verdict(x)].hint})\n`;
  if (isApp(x)) {
    return `Analiza esta mini app validada desde Facebook Ads Library y propón una versión mejorada que yo pueda construir y vender.

${header}Anunciante: ${x.advertiser}
Producto: ${x.product}
Tipo de mini app: ${x.app_type || 'Sin tipo'}
Nicho: ${x.niche}
País detectado: ${x.country || 'Sin país detectado'}${x.countries_seen && x.countries_seen.length ? ` (visto en: ${x.countries_seen.join(', ')})` : ''}
Palabra clave: ${x.keyword || '—'}
Landing/CTA: ${x.link || 'sin link'}
Precio: ${x.price ? `${x.price} ${x.currency}` : 'no visible'} · Cobro: ${x.billing || 'no visible'} · Checkout: ${x.checkout || 'no visible'}
Tecnología visible: ${x.tech || 'no visible'}
Días activo (anuncio más antiguo): ${fmt(x.days_active)}
Tendencia: ${x.trend}
Anuncios actuales: ${fmt(x.current_count)} · Previos: ${fmt(x.previous_count)} · Cambio: ${fmt(x.delta)} (${pct(x.pct_change)})
Score oportunidad: ${x.score}/100
Evaluación: ${x.evaluation}
Notas: ${x.notes}

Entrégame:
1) Qué problema resuelve la app y por qué se vende como producto (no como SaaS).
2) Avatar y momento de uso.
3) Funciones núcleo (MVP) vs. funciones que sobran.
4) Cómo la construiría rápido (no-code, web app/PWA o IA) y costo aproximado de operación.
5) Modelo de cobro recomendado (pago único vs. suscripción) y precio de entrada.
6) Diferenciación frente al anunciante.
7) 5 hooks para anuncios que muestren la app en uso.
8) Estructura de landing con demo.
9) Riesgos legales/éticos (datos personales, claims de salud o dinero, tiendas de apps).
`;
  }
  return `Analiza este producto validado desde Facebook Ads Library y propón una versión/copy mejorado para vender yo.

${header}Anunciante: ${x.advertiser}
Producto: ${x.product}
Nicho: ${x.niche}
País detectado: ${x.country || 'Sin país detectado'}
Palabra clave: ${x.keyword || '—'}
Landing/CTA: ${x.link || 'sin link'}
Tendencia: ${x.trend}
Anuncios actuales: ${fmt(x.current_count)}
Anuncios previos: ${fmt(x.previous_count)}
Cambio: ${fmt(x.delta)} (${pct(x.pct_change)})
Score oportunidad: ${x.score}/100
Evaluación: ${x.evaluation}
Notas: ${x.notes}

Entrégame:
1) Qué está validando este anunciante.
2) Avatar y dolor principal.
3) Mecanismo de la oferta.
4) Ángulo de copia mejorada en español.
5) 5 hooks para anuncios.
6) Estructura de landing.
7) Oferta low-ticket replicable y diferenciada.
8) Riesgos legales/éticos y cómo evitar claims problemáticos.
`;
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); alert(okMsg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove(); alert(ok ? okMsg : 'No se pudo copiar automáticamente.');
  }
}

/* Render general */
function fillSelect(id, values, allLabel) {
  const el = $(id), cur = el.value;
  el.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if (values.includes(cur)) el.value = cur;
}
function renderSelection() {
  $('selBar').hidden = selected.size === 0;
  $('selCount').textContent = `${selected.size} seleccionado${selected.size === 1 ? '' : 's'}`;
}
function render() {
  document.querySelectorAll('#trackSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.track === track)));
  document.querySelectorAll('#viewSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  $('title').textContent = TRACKS[track].title;
  document.title = `Radar · ${TRACKS[track].title}`;
  const d = TRACKS[track].data, apps = track === 'mini_apps', unavailable = apps && !d.available;
  ['appType', 'billing'].forEach(id => { $(id).hidden = !apps; });
  $('sort').querySelector('[value=days]').hidden = !apps;
  if (!apps && $('sort').value === 'days') $('sort').value = 'score';
  if (apps && d.available) {
    fillSelect('appType', d.app_types || [...new Set(d.items.map(x => x.app_type))].sort(), 'Todos los tipos');
    fillSelect('billing', d.billing_models || [...new Set(d.items.map(x => x.billing).filter(Boolean))].sort(), 'Todos los cobros');
  }
  $('notice').hidden = !unavailable; $('tools').hidden = unavailable;
  if (unavailable) {
    $('notice').innerHTML = `<strong>El radar de mini apps todavía no tiene datos.</strong><div class="small">${esc(d.error || 'Sin detalle.')}</div><div class="small" style="margin-top:6px">Crea la pestaña <b>Mini Apps</b> en el Sheet con sus encabezados y espera la primera ejecución del radar de mini apps.</div>`;
    $('viewPrioridades').hidden = true; $('viewMapa').hidden = true; renderSelection(); return;
  }
  $('viewPrioridades').hidden = view !== 'prioridades';
  $('viewMapa').hidden = view !== 'mapa';
  const rows = filtered();
  if (view === 'mapa') renderMapa(rows); else renderPrioridades(rows);
  renderSelection();
}
function setState(nextTrack, nextView) {
  if (TRACKS[nextTrack] && nextTrack !== track) { track = nextTrack; vFilter = ''; selMap = null; }
  if (nextView === 'prioridades' || nextView === 'mapa') view = nextView;
  store('radarTrack', track); store('radarView', view);
  const hash = `#${track}${view === 'mapa' ? '/mapa' : ''}`;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-track],[data-view],[data-v],[data-pick],[data-brief],[data-close],[data-copy-selected],[data-clear-selected],[data-id],#drawerBg');
  if (!t) return;
  if (t.dataset.track) return setState(t.dataset.track, view);
  if (t.dataset.view) return setState(track, t.dataset.view);
  if (t.dataset.v !== undefined) { vFilter = vFilter === t.dataset.v ? '' : t.dataset.v; return render(); }
  if (t.dataset.pick) {
    e.stopPropagation(); const id = t.dataset.pick;
    selected.has(id) ? selected.delete(id) : selected.add(id);
    render();
    if (!$('drawer').hidden && $('drawer').dataset.id === id) $('drawer').innerHTML = detailHtml(itemById(id), false);
    return;
  }
  if (t.dataset.brief) { e.stopPropagation(); const x = itemById(t.dataset.brief); if (x) copyText(briefFor(x), 'Brief copiado'); return; }
  if (t.dataset.copySelected !== undefined) { const arr = [...selected].map(itemById).filter(Boolean); return copyText(arr.map(briefFor).join('\n\n---\n\n'), `${arr.length} brief${arr.length === 1 ? '' : 's'} copiado${arr.length === 1 ? '' : 's'}`); }
  if (t.dataset.clearSelected !== undefined) { selected.clear(); return render(); }
  if (t.dataset.close !== undefined || t.id === 'drawerBg') return closeDrawer();
  if (t.dataset.id) { if (view === 'mapa' && t.closest('#viewMapa')) { selMap = t.dataset.id; return render(); } return openDrawer(t.dataset.id); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('drawer').hidden) return closeDrawer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.li,.hero')) { e.preventDefault(); openDrawer(e.target.dataset.id); }
});
['q', 'country', 'appType', 'billing', 'sort'].forEach(id => $(id).addEventListener('input', render));

$('updatedAt').textContent = new Intl.DateTimeFormat(undefined, { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }).format(new Date(DATA.generated_at));
$('count-pdf').textContent = TRACKS.pdf.data.items.length;
$('count-mini_apps').textContent = TRACKS.mini_apps.data.available ? TRACKS.mini_apps.data.items.length : '—';
setTimeout(() => location.reload(), 48 * 60 * 60 * 1000);

const [hashTrack, hashView] = location.hash.slice(1).split('/');
const savedTrack = recall('radarTrack');
const startTrack = TRACKS[hashTrack] ? hashTrack : (TRACKS[savedTrack] && TRACKS[savedTrack].data.available ? savedTrack : 'pdf');
const startView = hashTrack ? (hashView === 'mapa' ? 'mapa' : 'prioridades') : (recall('radarView') === 'mapa' ? 'mapa' : 'prioridades');
track = startTrack; view = startView;
setState(startTrack, startView);
</script>
</body>
</html>
